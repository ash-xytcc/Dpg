services:
  dpg-app:
    container_name: dpg-app
    build:
      context: .
      dockerfile: Dockerfile.vps
    restart: unless-stopped
    environment:
      DPG_STATE_DIR: /var/lib/dpg
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_RELAY_URL: http://dpg-resend-relay:8790
      RESEND_FROM: ${RESEND_FROM:-}
      RSVP_FORM_URL: ${RSVP_FORM_URL:-}
    volumes:
      - dpg-state:/var/lib/dpg
    ports:
      - "127.0.0.1:8788:8788"
    labels:
      - "traefik.enable=${TRAEFIK_ENABLE:-false}"
      - "traefik.docker.network=web"
      - "traefik.http.routers.dpg-app.entrypoints=websecure"
      - "traefik.http.routers.dpg-app.tls=true"
      - "traefik.http.routers.dpg-app.tls.certresolver=http-le"
      - "traefik.http.routers.dpg-app.rule=Host(`dualpowerwest.org`) || Host(`www.dualpowerwest.org`)"
      - "traefik.http.routers.dpg-app.middlewares=chain-no-auth@file"
      - "traefik.http.services.dpg-app.loadbalancer.server.port=8788"
    networks:
      - web
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8788/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  dpg-resend-relay:
    container_name: dpg-resend-relay
    build:
      context: .
      dockerfile: Dockerfile.resend-relay
    restart: unless-stopped
    environment:
      RESEND_RELAY_PORT: 8790
      RESEND_RELAY_HOST: 0.0.0.0
    networks:
      - web
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8790/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  dpg-state:

networks:
  web:
    external: true
